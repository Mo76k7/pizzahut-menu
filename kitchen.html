<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizza Hut — Kitchen Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#0A0A0C; color:#FFFFFF; min-height:100vh; padding:20px; }
        .container { max-width:1200px; margin:0 auto; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:16px; }
        .logo { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:24px; color:#EE1945; }
        .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-bottom:20px; }
        .stat-box { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:16px; text-align:center; }
        .stat-box .num { font-size:28px; font-weight:900; color:#FFAA00; }
        .stat-box .label { font-size:11px; color:#CBD5E1; text-transform:uppercase; margin-top:4px; }
        .order-card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:16px; margin-bottom:12px; transition:all .2s; }
        .order-card:hover { border-color:rgba(255,255,255,0.25); }
        .order-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:6px; }
        .order-id { font-weight:800; color:#FFAA00; font-size:16px; }
        .order-time { font-size:13px; color:#CBD5E1; }
        .order-items { font-size:14px; color:#CBD5E1; margin-bottom:8px; }
        .order-total { font-weight:800; font-size:16px; margin-bottom:8px; }
        .status-badge { padding:4px 12px; border-radius:20px; font-size:12px; font-weight:700; display:inline-block; }
        .status-badge.pending { background:rgba(245,158,11,0.2); color:#F59E0B; }
        .status-badge.accepted { background:rgba(59,130,246,0.2); color:#3B82F6; }
        .status-badge.preparing { background:rgba(245,158,11,0.3); color:#F59E0B; }
        .status-badge.ready { background:rgba(16,185,129,0.2); color:#10B981; }
        .order-actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
        .order-actions button { padding:8px 16px; border:none; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer; transition:all .2s; text-transform:uppercase; }
        .order-actions button:active { transform:scale(.96); }
        .btn-accept { background:#10B981; color:#FFF; }
        .btn-prepare { background:#F59E0B; color:#000; }
        .btn-ready { background:#EE1945; color:#FFF; }
        .empty-state { text-align:center; padding:60px 20px; color:#CBD5E1; }
        .empty-state i { font-size:48px; margin-bottom:16px; opacity:0.4; }
        .refresh-btn { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#FFF; padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:600; }
        .refresh-btn:hover { background:rgba(255,255,255,0.2); }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
        .new-order-pulse { animation:pulse 1.5s infinite; border-left:3px solid #EE1945; }
        .sound-toggle { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#FFF; padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12px; display:flex; align-items:center; gap:6px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><i class="fa-solid fa-utensils"></i> Kitchen Dashboard</div>
        <div style="display:flex;gap:10px;align-items:center;">
            <span style="font-size:13px;color:#CBD5E1;" id="live-status">🟢 Live</span>
            <button class="sound-toggle" onclick="toggleSound()"><i class="fa-solid fa-volume-high"></i> <span id="sound-label">On</span></button>
            <button class="refresh-btn" onclick="loadOrders()"><i class="fa-solid fa-rotate"></i> Refresh</button>
        </div>
    </div>
    <div class="stats" id="stats-container">
        <div class="stat-box"><div class="num" id="stat-pending">0</div><div class="label">Pending</div></div>
        <div class="stat-box"><div class="num" id="stat-preparing">0</div><div class="label">Preparing</div></div>
        <div class="stat-box"><div class="num" id="stat-ready">0</div><div class="label">Ready</div></div>
        <div class="stat-box"><div class="num" id="stat-total">0</div><div class="label">Total Today</div></div>
    </div>
    <div id="orders-container"></div>
</div>
<script>
const STORAGE_KEY = 'ph_orders';
const KITCHEN_TELEGRAM = "MO76k7";

let soundEnabled = true;
let audioCtx = null;

function playNotificationSound() {
    if (!soundEnabled) return;
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value = 800;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        setTimeout(() => {
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.connect(gain2); gain2.connect(audioCtx.destination);
            osc2.frequency.value = 1000;
            osc2.type = 'sine';
            gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc2.start(); osc2.stop(audioCtx.currentTime + 0.2);
        }, 200);
    } catch(e) {}
}

function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById('sound-label').textContent = soundEnabled ? 'On' : 'Off';
}

function loadOrders() {
    try {
        const data = localStorage.getItem(STORAGE_KEY);
        const orders = data ? JSON.parse(data) : [];
        renderOrders(orders);
        updateStats(orders);
    } catch(e) { renderOrders([]); updateStats([]); }
}

function renderOrders(orders) {
    const container = document.getElementById('orders-container');
    if (!orders.length) {
        container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-plate-wheat"></i><h3>No Orders Yet</h3><p>Waiting for customer orders from the menu...</p></div>`;
        return;
    }
    // Show newest first
    const sorted = [...orders].reverse();
    let pendingCount = 0;
    container.innerHTML = sorted.map(order => {
        const statusClass = order.status || 'pending';
        if (statusClass === 'pending') pendingCount++;
        const isNew = statusClass === 'pending';
        const itemsList = (order.items || []).map(it => `${it.name}${it.size ? ` (${it.size})` : ''} x${it.quantity}`).join(', ');
        const actions = statusClass === 'pending' ? 
            `<button class="btn-accept" onclick="updateOrder(${order.id},'accepted')"><i class="fa-solid fa-check"></i> Accept</button>` :
            statusClass === 'accepted' ?
            `<button class="btn-prepare" onclick="updateOrder(${order.id},'preparing')"><i class="fa-solid fa-fire"></i> Preparing</button>` :
            statusClass === 'preparing' ?
            `<button class="btn-ready" onclick="updateOrder(${order.id},'ready')"><i class="fa-solid fa-flag-checkered"></i> Ready</button>` :
            `<span style="color:#10B981;font-weight:700;">✅ Completed</span>`;
        
        return `<div class="order-card ${isNew ? 'new-order-pulse' : ''}">
            <div class="order-header">
                <span class="order-id">#${order.orderNo || 'N/A'} — Table ${order.table || 'N/A'}</span>
                <span class="order-time">${order.timestamp ? new Date(order.timestamp).toLocaleTimeString() : ''}</span>
            </div>
            <div class="order-items">${itemsList || 'No items'}</div>
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
                <span class="order-total">Total: Br ${(order.total || 0).toFixed(2)}</span>
                <span class="status-badge ${statusClass}">${statusClass.toUpperCase()}</span>
            </div>
            <div class="order-actions">${actions}</div>
        </div>`;
    }).join('');
    
    // Play sound if there are pending orders
    if (pendingCount > 0) playNotificationSound();
}

function updateStats(orders) {
    const pending = orders.filter(o => (o.status||'pending') === 'pending').length;
    const preparing = orders.filter(o => o.status === 'preparing').length;
    const ready = orders.filter(o => o.status === 'ready').length;
    document.getElementById('stat-pending').textContent = pending;
    document.getElementById('stat-preparing').textContent = preparing;
    document.getElementById('stat-ready').textContent = ready;
    document.getElementById('stat-total').textContent = orders.length;
}

function updateOrder(id, status) {
    try {
        const data = localStorage.getItem(STORAGE_KEY);
        const orders = data ? JSON.parse(data) : [];
        const order = orders.find(o => o.id === id);
        if (!order) return;
        order.status = status;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
        loadOrders();
        
        // If order is ready, notify customer via tracker update
        if (status === 'ready') {
            // The customer side will see this on next refresh
            console.log(`Order #${order.orderNo} is ready for pickup!`);
        }
    } catch(e) {}
}

// Auto-refresh every 10 seconds
setInterval(loadOrders, 10000);

// Listen for storage changes from other tabs
window.addEventListener('storage', (e) => {
    if (e.key === STORAGE_KEY) loadOrders();
});

// Initial load
loadOrders();

// Telegram integration - accept orders from Telegram
// Check for new messages from the kitchen bot
console.log(`Kitchen Telegram: @${KITCHEN_TELEGRAM}`);
console.log('Orders are stored locally and shared across pages.');
</script>
</body>
</html>
